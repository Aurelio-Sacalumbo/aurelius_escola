<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#060b19">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário de Turmas Ocupadas - Academia Aurélius</title>
    <style>
        body { font-family: sans-serif; background: #031a58; color: #fff; padding: 20px; text-align: center; }
        h3 { color: #eab308; }
        .form-input {
            width: 90%; max-width: 500px; padding: 10px; margin: 10px auto; 
            background: #0d1527; color: #fff; border: 1px solid #1e293b; border-radius: 6px; font-size: 14px;
        }
        .container-acordeon { width: 90%; max-width: 1000px; margin: 20px auto; text-align: left; }
        .aluno-header-gatilho {
            display: grid; grid-template-columns: 2fr 1fr 1fr; padding: 14px 15px;
            background: #0d1527; border: 1px solid #1e293b; margin-top: 8px;
            border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .aluno-header-gatilho:hover { background: #111c35; border-color: #eab308; }
        .painel-detalhes-oculto { display: none; background: #070b14; padding: 15px; border: 1px dashed rgba(234, 179, 8, 0.3); border-top: none; border-radius: 0 0 6px 6px; }
        .tabela-interna { width: 100%; border-collapse: collapse; font-size: 13px; }
        .tabela-interna th { color: #eab308; padding: 8px; border-bottom: 1px solid #1e293b; text-align: left; }
        .tabela-interna td { padding: 10px 8px; border-bottom: 1px dashed rgba(255,255,255,0.05); text-align: left; }
        .badge { padding: 3px 6px; font-size: 11px; font-weight: bold; border-radius: 3px; text-transform: uppercase; color: #000; }
    </style>
</head>
<body>

    <nav style="margin-bottom: 20px;">
        <a href="Principal.html" style="display: inline-block; color: #eab308; border: 1px solid #1e293b; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; background-color: #0d1527;">Home</a>
    </nav>

    <h3>Horário de turmas ocupada</h3>
    <p style="color: #fff; font-size: 13px;">Introduza o termo de pesquisa completo.</p>
    
    <!-- 🔍 PESQUISA REALIMENTADA EM TEMPO REAL PELO SEU ENDPOINT GET -->
    <input type="text" id="campo_busca_alunos" class="form-input" placeholder="🔍 Digite o nome ou número para pesquisar..." oninput="filtrarAcordeonPublico(this.value)">

    

    <div id="listaPublicaAcordeon" class="container-acordeon">
        <div id="status_carregamento_inicial" style="text-align:center; padding:20px; color:#64748b;">Aguardando nome de pesquisa académica...</div>
    </div>



    <script>
    let temporizadorChamada = null;

    function filtrarAcordeonPublico(termo) {
        clearTimeout(temporizadorChamada);
        const container = document.getElementById('listaPublicaAcordeon');
        if (!container) return;

        if (termo.trim() === "") {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:#64748b;">Aguardando termo de pesquisa académica...</div>`;
            return;
        }

        // Aguarda 300ms para o utilizador terminar de digitar e evitar travamentos
        temporizadorChamada = setTimeout(() => {
            carregarListaPublicaBancoNuvem(termo);
        }, 300);
    }

    function carregarListaPublicaBancoNuvem(termo = "") {
        const container = document.getElementById('listaPublicaAcordeon');
        if (!container) return;

        container.innerHTML = `<div style="text-align:center; padding:20px; color:#eab308;">A consultar base académica .... </div>`;

        fetch(`obter_turmas_publicas.php?termo=${encodeURIComponent(termo)}`)
            .then(res => {
                if (!res.ok) throw new Error("Erro na resposta da rede");
                return res.json();
            })
            .then(resposta => {
                // Validação defensiva do array de dados
                if (!resposta.sucesso || !resposta.dados || resposta.dados.length === 0) {
                    container.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444;">❌ Nenhum estudante localizado com o nome "${termo}".</div>`;
                    return;
                }

                let htmlAcordeon = '';

                resposta.dados.forEach(aluno => {
                    // Proteção contra dados vazios na raiz do loop
                    if (!aluno || !aluno.nome) return;
                    
                    let linhasTabela = '';

                    if (aluno.modulos && aluno.modulos.length > 0) {
                        aluno.modulos.forEach(m => {
                            let estadoLimpo = m.estatuto ? m.estatuto.toLowerCase() : 'pendente';
                            let badgeColor = (estadoLimpo === 'aprovado' || estadoLimpo === 'alocado') ? '#10b981' : '#f59e0b';
                            let textoBadge = (estadoLimpo === 'aprovado' || estadoLimpo === 'alocado') ? 'Apto' : ' Pendente';

                            linhasTabela += `
                                <tr>
                                    <td><b> ${m.disciplina}</b></td>
                                    <td><code>${m.horario}</code></td>
                                    <td> ${m.professor}</td>
                                    <td><span class="badge" style="background:${badgeColor}; color:#000;">${textoBadge}</span></td>
                                </tr>
                            `;
                        });
                    } else {
                        linhasTabela = `<tr><td colspan="4" style="text-align:center; color:#64748b; padding:15px;">Aguardando alocação de turmas pelo pedagógico.</td></tr>`;
                    }

                    htmlAcordeon += `
                        <div class="bloco-estudante-lista">
                            <div class="aluno-header-gatilho" onclick="alternarVisibilidadeListaPublica(${aluno.id})">
                                <div style="font-weight: bold; color: #fff;"> ${aluno.nome} <small style="color:#64748b; font-weight:normal; margin-left:8px;">(${aluno.telefone})</small></div>
                                <div style="color: #eab308;">${aluno.classe}</div>
                                <div style="color: #38bdf8;">${aluno.periodo}</div>
                            </div>
                            <div id="painel_publico_${aluno.id}" class="painel-detalhes-oculto" style="display:block;">
                                <table class="tabela-interna">
                                    <thead>
                                        <tr>
                                            <th>Disciplina</th>
                                            <th>Horário</th>
                                            <th>Docente </th>
                                            <th>Estado </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${linhasTabela}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = htmlAcordeon;
            })
            .catch(err => {
                console.error("Erro na Fetch API:", err);
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#ef4444;">⚠️ Falha de comunicação com o servidor central.</div>`;
            });
    }

    function alternarVisibilidadeListaPublica(idAluno) {
        const painel = document.getElementById(`painel_publico_${idAluno}`);
        if (painel) {
            painel.style.display = (painel.style.display === 'block') ? 'none' : 'block';
        }
    }
</script>
</body>
</html>
