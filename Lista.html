<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#060b19">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horário de Turmas Ocupadas - Academia Aurélius</title>
    <style>
        body { font-family: sans-serif; background: #060b19; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #eab308; }
        table { width: 90%; max-width: 1000px; margin: 30px auto; border-collapse: collapse; background: #0d1527; text-align: center; }
        th, td { padding: 12px; border: 1px solid #1e293b; }
        th { background: #111c35; color: #eab308; }
        .badge { padding: 3px 6px; font-size: 11px; font-weight: bold; border-radius: 3px; text-transform: uppercase; color: #000; }
    </style>
</head>

<body>

    <nav style="margin-bottom: 20px;">
        <a href="Principal.html" style="
            display: inline-block;
            color: #eab308;
            border: 1px solid #1e293b;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            background-color: #0d1527;
            transition: all 0.3s ease;
        " onmouseover="this.style.backgroundColor='#111c35'; this.style.borderColor='#eab308';" 
          onmouseout="this.style.backgroundColor='#0d1527'; this.style.borderColor='#1e293b';">
            Home
        </a>
    </nav>
    
  
    <table>
        <thead>
            <tr>
                <th>Nome do Aluno</th>
                <th>Classe</th>
                <th>Período</th>
                <th>Hora</th>
                <th>Disciplina</th>
                <th>Professor</th>
                <th>Estatuto</th>
            </tr>
        </thead>
        <tbody id="listaPublica">
            <!-- Dados puros carregados localmente aqui -->
        </tbody>
    </table>

<script>
    // 🧠 SINCRONIZAÇÃO COMPLETA COM A BASE LOCAL DO PROFESSOR
    document.addEventListener("DOMContentLoaded", () => {
        const tbody = document.getElementById('listaPublica');
        if (!tbody) return;

        // Captura os mesmos dados que o professor acabou de salvar
        const dadosLocais = JSON.parse(localStorage.getItem('bd_pautas_professor')) || [];
        tbody.innerHTML = "";

        if (dadosLocais.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#94a3b8;">Nenhuma turma operacional registada no momento.</td></tr>`;
            return;
        }

        // Renderiza os dados na tabela pública
        dadosLocais.forEach(row => {
            let badgeColor = row.estado === 'aprovado' ? '#10b981' : (row.estado === 'rejeitado' ? '#ef4444' : '#f59e0b');
            tbody.innerHTML += `
                <tr>
                    <td><b>${row.nome_aluno}</b></td>
                    <td>${row.classe}</td>
                    <td>${row.periodo}</td>
                    <td><code>${row.hora}</code></td>
                    <td>${row.disciplina}</td>
                    <td>${row.professor}</td>
                    <td><span class="badge" style="background:${badgeColor};">${row.estado}</span></td>
                </tr>
            `;
        });
    });
</script>

<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('PWA Lista Ativo!'));
      });
    }
</script>
</body>
</html>
